<div [matTooltip]="display() ? `Średnia: ${value?.toPrecision(3)}` : null" matTooltipPosition="above">
  <input type="number" min="1" max="5" [formControl]="control" style="display: none;">
  @for (i of [1,2,3,4,5]; track $index) {
    <app-star [i]="i" [(value)]="value" [disabled]="disabled" [display]="display()"/>
  }
</div>
