<h1>Karta oceny</h1>
@for (item of items; track $index) {
<mat-divider></mat-divider>
<mat-card>
  <mat-card-header>
    <mat-card-title>{{item.name | capitalize}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="item.value">
      <app-star-control formControlName="rating"></app-star-control>
      <mat-chip-listbox multiple formControlName="tags">
        @for (opt of TAGS[item.type]; track $index) {
          <mat-chip-option>{{opt}}</mat-chip-option>
        }
      </mat-chip-listbox>
      <mat-form-field>
        <mat-label>Uwagi</mat-label>
        <textarea matInput formControlName="comment"></textarea>
      </mat-form-field>
    </form>
  </mat-card-content>
</mat-card>
}
<mat-divider></mat-divider>
<button (click)="close()">Zamknij</button>
